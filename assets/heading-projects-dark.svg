<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-labelledby="t">
  <title id="t">Currently Building</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#C084FC"/></linearGradient></defs>
  <style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
.drift { animation: drift 16s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(-60px, 30px); } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .drift, .pulse { animation: none; } }
</style>
  <text class="mono" x="500.0" y="28" font-size="15" letter-spacing="4" fill="#6366F1" text-anchor="middle">01 · PROJECTS</text>
  <text class="sans" x="500.0" y="70" font-size="32" font-weight="800" fill="#F8FAFC" text-anchor="middle">Currently Building</text>
  <rect x="468.0" y="86" width="64" height="4" rx="2" fill="url(#g)"/>
</svg>
