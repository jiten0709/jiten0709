<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="824" viewBox="0 0 1000 824" role="img" aria-labelledby="t">
  <title id="t">Technical ecosystem. Languages: Python, JavaScript, TypeScript, SQL. Generative AI &amp; Agents: LangChain, LangGraph, LlamaIndex, MCP, RAG, AI Agents, Prompt Engineering. LLM Engineering: Hugging Face, vLLM, Ollama, LoRA, PEFT, Fine-tuning, LLM APIs. Evaluation &amp; Observability: RAGAS, TruLens, LangSmith. Machine Learning &amp; CV: PyTorch, TensorFlow, Scikit-learn, CNN, NLP, OpenCV, YOLO. Vector Search &amp; Data: Qdrant, Pinecone, Weaviate, Milvus, FAISS, ChromaDB, LanceDB, PostgreSQL, MongoDB. Backend &amp; APIs: FastAPI, Flask, Django, Node.js, NestJS, RESTful APIs. Frontend &amp; AI Interfaces: React.js, Next.js, Vue.js, Streamlit, Chainlit. Cloud &amp; MLOps: GCP (Vertex AI, AutoML), AWS, Azure, MLflow, Docker, Kubernetes, CI/CD, Git. Workflow Automation: n8n, Make, Zapier.</title>
  <style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
.drift { animation: drift 16s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(-60px, 30px); } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .drift, .pulse { animation: none; } }
</style>
